# robertfitchell.online — статика на training-vps (Timeweb, Новосибирск, РФ).
# Кладётся в /etc/nginx/sites-available/robertfitchell-online, симлинк в sites-enabled.
# HTTPS-блок дописывает certbot сам (--nginx).

server {
    listen 80;
    listen [::]:80;
    server_name robertfitchell.online www.robertfitchell.online;

    root /var/www/robertfitchell-online;
    index index.html;

    # редирект www → без www включим после выпуска сертификата
    # (до этого https ещё не отвечает)

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # шрифты и статика — долгий кеш
    location ~* \.(woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # скрипты и стили — короткий кеш: правки должны долетать быстро
    location ~* \.(js|css)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # html — короткий кеш, чтобы правки долетали сразу
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ПДн в логи не пишем: убираем query string из access_log
    access_log /var/log/nginx/robertfitchell-online.access.log;
    error_log  /var/log/nginx/robertfitchell-online.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
